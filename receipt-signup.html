<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가입하기 - 영수증리뷰</title>
<meta name="description" content="영수증리뷰 가입. 결제 후 바로 사용 가능합니다.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --primary: #03C75A;
  --primary-dark: #02a84d;
  --text: #1a1a1a;
  --text-light: #666;
  --bg: #f5f5f5;
  --card: #fff;
  --border: #e0e0e0;
  --error: #dc2626;
  --success: #16a34a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #f8f9fa 0%, #e8f8ef 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 480px;
  padding: 48px 40px;
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 48px;
  height: 48px;
  background: var(--primary);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.logo-icon span { color: white; font-weight: 900; font-size: 22px; line-height: 1; }
.logo-icon small { color: white; font-size: 8px; font-weight: 700; }
.logo-text { font-size: 22px; font-weight: 700; color: var(--text); }

h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: var(--text-light);
  font-size: 14px;
  margin-bottom: 32px;
}

.tabs {
  display: flex;
  margin-bottom: 24px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--border);
}
.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-light);
  transition: all 0.2s;
  background: white;
}
.tab.active {
  background: var(--primary);
  color: white;
}

.form-section { display: none; }
.form-section.active { display: block; }

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  transition: all 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(3,199,90,0.1);
}
.form-group input::placeholder {
  color: #aaa;
}
.hint {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

.btn {
  width: 100%;
  padding: 16px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: var(--primary-dark); }
.btn:disabled { background: #ccc; cursor: not-allowed; }

.links {
  text-align: center;
  margin-top: 24px;
}
.links a {
  color: var(--primary);
  text-decoration: none;
  font-size: 14px;
}

.error {
  background: #fee2e2;
  color: var(--error);
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.success {
  background: #dcfce7;
  color: var(--success);
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: center;
  display: none;
}
.success h3 { margin-bottom: 8px; font-size: 18px; }
.success p { font-size: 14px; line-height: 1.6; }

.price-info {
  background: #f0fdf4;
  border: 2px solid var(--primary);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-bottom: 24px;
}
.price-info .price {
  font-size: 32px;
  font-weight: 800;
  color: var(--primary);
}
.price-info .period {
  font-size: 14px;
  color: var(--text-light);
}

@media (max-width: 480px) {
  .container { padding: 32px 24px; }
  h1 { font-size: 20px; }
  .price-info .price { font-size: 28px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-icon"><span>N</span><small>리뷰</small></div>
    <div class="logo-text">영수증리뷰</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('signup')">가입하기</div>
    <div class="tab" onclick="showTab('login')">로그인</div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success">
    <h3>가입 신청 완료!</h3>
    <p>담당자 확인 후 승인됩니다.<br>승인되면 로그인하여 프로그램을 다운로드할 수 있습니다.</p>
    <p style="margin-top:16px;font-size:13px;color:#666;">빠른 승인을 원하시면 담당자에게 문의해주세요.<br><strong>010-7541-0805</strong></p>
  </div>

  <!-- 가입 폼 -->
  <div class="form-section active" id="signup-form">
    <h1>서비스 가입 신청</h1>
    <p class="subtitle">가입 신청 후 담당자 승인이 필요합니다</p>

    <div class="form-group">
      <label>매장명 <span style="color:#e53935">*</span></label>
      <input type="text" id="signup-store" placeholder="OO식당 강남점" required>
    </div>
    <div class="form-group">
      <label>대표자명 <span style="color:#e53935">*</span></label>
      <input type="text" id="signup-name" placeholder="홍길동" required>
    </div>
    <div class="form-group">
      <label>연락처 <span style="color:#e53935">*</span></label>
      <input type="tel" id="signup-phone" placeholder="010-1234-5678" required>
    </div>
    <div class="form-group">
      <label>이메일 (로그인 아이디) <span style="color:#e53935">*</span></label>
      <input type="email" id="signup-email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label>비밀번호 <span style="color:#e53935">*</span></label>
      <input type="password" id="signup-password" placeholder="6자 이상 입력" required>
      <p class="hint">프로그램 로그인에 사용됩니다</p>
    </div>
    <div class="form-group">
      <label>비밀번호 확인 <span style="color:#e53935">*</span></label>
      <input type="password" id="signup-password2" placeholder="비밀번호 재입력" required>
    </div>

    <button class="btn" onclick="submitSignup()" id="signup-btn">가입 신청하기</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="form-section" id="login-form">
    <h1>로그인</h1>
    <p class="subtitle">가입 시 설정한 정보로 로그인하세요</p>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호">
    </div>

    <button class="btn" onclick="login()" id="login-btn">로그인</button>
  </div>

  <div class="links">
    <a href="receipt-review.html">← 서비스 소개로 돌아가기</a>
  </div>
</div>

<script>
const API_BASE = 'https://review.placemaster.co.kr';

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';

  if (tab === 'signup') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('signup-form').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('login-form').classList.add('active');
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function submitSignup() {
  const store = document.getElementById('signup-store').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const phone = document.getElementById('signup-phone').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const password2 = document.getElementById('signup-password2').value;

  document.getElementById('error').style.display = 'none';

  if (!store || !name || !phone || !email || !password || !password2) {
    showError('모든 항목을 입력해주세요.');
    return;
  }

  if (password.length < 6) {
    showError('비밀번호는 6자 이상 입력해주세요.');
    return;
  }

  if (password !== password2) {
    showError('비밀번호가 일치하지 않습니다.');
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showError('올바른 이메일 형식이 아닙니다.');
    return;
  }

  const btn = document.getElementById('signup-btn');
  btn.disabled = true;
  btn.textContent = '처리 중...';

  try {
    const response = await fetch(`${API_BASE}/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        store_name: store,
        owner_name: name,
        phone: phone,
        email: email,
        password: password
      })
    });

    const data = await response.json();

    if (data.success) {
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    } else {
      showError(data.detail || '가입 중 오류가 발생했습니다.');
      btn.disabled = false;
      btn.textContent = '가입 신청하기';
    }
  } catch (error) {
    console.error('Signup error:', error);
    showError('서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = '가입 신청하기';
  }
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  document.getElementById('error').style.display = 'none';

  if (!email || !password) {
    showError('이메일과 비밀번호를 입력해주세요.');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  try {
    const response = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.success) {
      // 토큰 저장
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('store_name', data.store_name);

      // 다운로드 페이지로 이동
      window.location.href = 'receipt-review.html#download';
    } else {
      showError(data.message || '로그인에 실패했습니다.');
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  } catch (error) {
    console.error('Login error:', error);
    showError('서버 연결에 실패했습니다.');
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

// Enter 키 처리
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('signup-form').classList.contains('active')) {
      submitSignup();
    } else {
      login();
    }
  }
});
</script>

</body>
</html>
