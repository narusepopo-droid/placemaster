<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 플레이스 마스터 PRO</title>
<meta name="description" content="플레이스 마스터 PRO 회원가입. 무료로 가입하고 네이버 플레이스 순위 추적을 시작하세요.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #f8f9fa 0%, #e8f8ef 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 440px;
  padding: 48px 40px;
}
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 48px;
  height: 48px;
  background: #03C75A;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.logo-icon span { color: white; font-weight: 900; font-size: 22px; line-height: 1; }
.logo-icon small { color: white; font-size: 8px; font-weight: 700; }
.logo-text { font-size: 22px; font-weight: 700; color: #1a1a1a; }
.logo-text .pro { color: #03C75A; }

h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  transition: all 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: #03C75A;
  box-shadow: 0 0 0 4px rgba(3,199,90,0.1);
}
.form-group input::placeholder {
  color: #aaa;
}
.password-hint {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

.btn {
  width: 100%;
  padding: 16px;
  background: #03C75A;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: #02a84d; }
.btn:disabled { background: #ccc; cursor: not-allowed; }

.links {
  text-align: center;
  margin-top: 24px;
}
.links a {
  color: #03C75A;
  text-decoration: none;
  font-size: 14px;
}

.error {
  background: #fee2e2;
  color: #dc2626;
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}
.success {
  background: #dcfce7;
  color: #16a34a;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: center;
  display: none;
}
.success h3 { margin-bottom: 8px; font-size: 18px; }
.success p { font-size: 14px; line-height: 1.6; }

.tabs {
  display: flex;
  margin-bottom: 24px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid #e0e0e0;
}
.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  font-weight: 600;
  color: #666;
  transition: all 0.2s;
}
.tab.active {
  background: #03C75A;
  color: white;
}
.form-section { display: none; }
.form-section.active { display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-icon"><span>N</span><small>PRO</small></div>
    <div class="logo-text">플레이스 마스터 <span class="pro">PRO</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('signup')">가입신청</div>
    <div class="tab" onclick="showTab('login')">로그인</div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success">
    <h3>가입 신청 완료!</h3>
    <p>관리자 승인 후<br>설정한 비밀번호로 로그인 가능합니다.</p>
    <p style="margin-top:12px;font-size:13px;color:#666;">승인까지 영업일 기준 1일 이내 소요</p>
  </div>

  <!-- 가입신청 폼 -->
  <div class="form-section active" id="signup-form">
    <h1>가입 신청</h1>
    <p class="subtitle">신청 후 승인되면 바로 사용 가능합니다</p>

    <div class="form-group">
      <label>매장명 <span style="color:#e53935">*</span></label>
      <input type="text" id="signup-store" placeholder="OO카페 강남점" required>
    </div>
    <div class="form-group">
      <label>이름 <span style="color:#e53935">*</span></label>
      <input type="text" id="signup-name" placeholder="홍길동" required>
    </div>
    <div class="form-group">
      <label>연락처 <span style="color:#e53935">*</span></label>
      <input type="tel" id="signup-phone" placeholder="010-1234-5678" required>
      <p class="password-hint">승인 시 이 번호로 로그인 정보가 발송됩니다</p>
    </div>
    <div class="form-group">
      <label>이메일 (로그인 아이디) <span style="color:#e53935">*</span></label>
      <input type="email" id="signup-email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label>비밀번호 <span style="color:#e53935">*</span></label>
      <input type="password" id="signup-password" placeholder="6자 이상 입력" required>
    </div>
    <div class="form-group">
      <label>비밀번호 확인 <span style="color:#e53935">*</span></label>
      <input type="password" id="signup-password2" placeholder="비밀번호 재입력" required>
    </div>
    <button class="btn" onclick="submitSignup()" id="signup-btn">가입 신청하기</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="form-section" id="login-form">
    <h1>로그인</h1>
    <p class="subtitle">가입 시 설정한 정보로 로그인하세요</p>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호">
    </div>
    <button class="btn" onclick="login()" id="login-btn">로그인</button>
  </div>

  <div class="links">
    <a href="index.html">← 홈으로 돌아가기</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDUVSMYnDOJN21iI2WireY_OUlVkbRAsOo",
  authDomain: "placemaster-pro.firebaseapp.com",
  projectId: "placemaster-pro",
  storageBucket: "placemaster-pro.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';

  if (tab === 'signup') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('signup-form').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('login-form').classList.add('active');
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function submitSignup() {
  const store = document.getElementById('signup-store').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const phone = document.getElementById('signup-phone').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const password2 = document.getElementById('signup-password2').value;

  document.getElementById('error').style.display = 'none';

  if (!store || !name || !phone || !email || !password || !password2) {
    showError('모든 항목을 입력해주세요.');
    return;
  }

  if (password.length < 6) {
    showError('비밀번호는 6자 이상 입력해주세요.');
    return;
  }

  if (password !== password2) {
    showError('비밀번호가 일치하지 않습니다.');
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showError('올바른 이메일 형식이 아닙니다.');
    return;
  }

  const btn = document.getElementById('signup-btn');
  btn.disabled = true;
  btn.textContent = '신청 중...';

  try {
    // signups 컬렉션에 저장 (비밀번호 포함)
    await db.collection('signups').add({
      company: store,
      name: name,
      phone: phone,
      email: email,
      password: password,
      status: 'pending',
      createdAt: new Date().toISOString().split('T')[0] + ' ' + new Date().toTimeString().split(' ')[0]
    });

    // 관리자에게 SMS 알림 (플레이스랭킹 서버 통해 발송)
    try {
      await fetch('https://placeranking.com/api/sms/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          receiver: '01075410805',
          msg: `[플마PRO 가입신청]\n매장: ${store}\n이름: ${name}\n연락처: ${phone}\n이메일: ${email}`,
          sender: '01075410805'
        })
      });
    } catch (smsErr) {
      console.log('SMS 발송 실패:', smsErr);
    }

    // 성공 메시지 표시
    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('success').style.display = 'block';

  } catch (error) {
    console.error('Signup error:', error);
    showError('신청 중 오류가 발생했습니다. 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = '가입 신청하기';
  }
}

function login() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;

  document.getElementById('error').style.display = 'none';

  if (!email || !pw) {
    showError('이메일과 비밀번호를 입력해주세요.');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  auth.signInWithEmailAndPassword(email, pw)
    .then((userCredential) => {
      window.location.href = 'index.html';
    })
    .catch(async (error) => {
      btn.disabled = false;
      btn.textContent = '로그인';

      let msg = '로그인 중 오류가 발생했습니다.';
      if (error.code === 'auth/user-not-found') {
        // 가입 신청 중인지 확인
        const pendingSignup = await db.collection('signups')
          .where('email', '==', email)
          .where('status', '==', 'pending')
          .limit(1).get();
        if (!pendingSignup.empty) {
          msg = '가입신청 승인대기중입니다. 승인 후 로그인 가능합니다.';
        } else {
          msg = '등록되지 않은 이메일입니다. 가입 신청 후 승인을 기다려주세요.';
        }
      } else if (error.code === 'auth/wrong-password') {
        msg = '비밀번호가 올바르지 않습니다.';
      } else if (error.code === 'auth/invalid-email') {
        msg = '올바른 이메일 형식이 아닙니다.';
      }
      showError(msg);
    });
}

// Enter 키로 제출
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('signup-form').classList.contains('active')) {
      submitSignup();
    } else {
      login();
    }
  }
});
</script>
</body>
</html>
