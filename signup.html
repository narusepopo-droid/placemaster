<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 플레이스 마스터 PRO</title>
<meta name="description" content="플레이스 마스터 PRO 회원가입. 무료로 가입하고 네이버 플레이스 순위 추적을 시작하세요.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #f8f9fa 0%, #e8f8ef 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 440px;
  padding: 48px 40px;
}
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 48px;
  height: 48px;
  background: #03C75A;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.logo-icon span { color: white; font-weight: 900; font-size: 22px; line-height: 1; }
.logo-icon small { color: white; font-size: 8px; font-weight: 700; }
.logo-text { font-size: 22px; font-weight: 700; color: #1a1a1a; }
.logo-text .pro { color: #03C75A; }

h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  transition: all 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: #03C75A;
  box-shadow: 0 0 0 4px rgba(3,199,90,0.1);
}
.form-group input::placeholder {
  color: #aaa;
}

.btn {
  width: 100%;
  padding: 16px;
  background: #03C75A;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn:hover {
  background: #02a54b;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(3,199,90,0.3);
}
.btn:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.divider {
  display: flex;
  align-items: center;
  margin: 28px 0;
  color: #aaa;
  font-size: 13px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e0e0e0;
}
.divider span { padding: 0 16px; }

.links {
  text-align: center;
  margin-top: 24px;
}
.links a {
  color: #03C75A;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
.links a:hover {
  text-decoration: underline;
}

.error {
  background: #fff0f0;
  color: #e53935;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 20px;
  display: none;
}
.success {
  background: #e8f8ef;
  color: #03C75A;
  padding: 16px;
  border-radius: 10px;
  font-size: 14px;
  text-align: center;
  display: none;
}
.success h3 {
  font-size: 18px;
  margin-bottom: 8px;
}

.password-hint {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

.tabs {
  display: flex;
  margin-bottom: 28px;
  border-radius: 12px;
  background: #f5f5f5;
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.2s;
}
.tab.active {
  background: white;
  color: #03C75A;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-section { display: none; }
.form-section.active { display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-icon"><span>N</span><small>PRO</small></div>
    <div class="logo-text">플레이스 마스터 <span class="pro">PRO</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('signup')">회원가입</div>
    <div class="tab" onclick="showTab('login')">로그인</div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success">
    <h3>가입 완료!</h3>
    <p>이제 프로그램을 다운로드하여 사용하실 수 있습니다.</p>
    <a href="https://github.com/narusepopo-droid/placemaster/releases/download/v8.46/PlaceMasterPRO.zip" class="btn" style="display:inline-block; margin-top:16px; width:auto; padding:14px 32px;" download>프로그램 다운로드</a>
  </div>

  <!-- 회원가입 폼 -->
  <div class="form-section active" id="signup-form">
    <h1>회원가입</h1>
    <p class="subtitle">무료로 가입하고 플레이스 순위 추적을 시작하세요</p>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="signup-email" placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="signup-password" placeholder="비밀번호 입력">
      <p class="password-hint">최소 6자 이상 입력해주세요</p>
    </div>
    <div class="form-group">
      <label>비밀번호 확인</label>
      <input type="password" id="signup-password2" placeholder="비밀번호 다시 입력">
    </div>
    <button class="btn" onclick="signup()" id="signup-btn">가입하기</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="form-section" id="login-form">
    <h1>로그인</h1>
    <p class="subtitle">계정에 로그인하세요</p>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호 입력">
    </div>
    <button class="btn" onclick="login()" id="login-btn">로그인</button>
  </div>

  <div class="links">
    <a href="index.html">← 홈으로 돌아가기</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDUVSMYnDOJN21iI2WireY_OUlVkbRAsOo",
  authDomain: "placemaster-pro.firebaseapp.com",
  projectId: "placemaster-pro",
  storageBucket: "placemaster-pro.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';

  if (tab === 'signup') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('signup-form').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('login-form').classList.add('active');
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function signup() {
  const email = document.getElementById('signup-email').value.trim();
  const pw = document.getElementById('signup-password').value;
  const pw2 = document.getElementById('signup-password2').value;

  document.getElementById('error').style.display = 'none';

  if (!email || !pw) {
    showError('이메일과 비밀번호를 입력해주세요.');
    return;
  }
  if (pw.length < 6) {
    showError('비밀번호는 최소 6자 이상이어야 합니다.');
    return;
  }
  if (pw !== pw2) {
    showError('비밀번호가 일치하지 않습니다.');
    return;
  }

  const btn = document.getElementById('signup-btn');
  btn.disabled = true;
  btn.textContent = '가입 중...';

  auth.createUserWithEmailAndPassword(email, pw)
    .then((userCredential) => {
      // SMS 알림 발송
      fetch('https://placeranking.com/api/placemaster/signup-notify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
      }).catch(() => {});

      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.querySelector('.tabs').style.display = 'none';
    })
    .catch((error) => {
      btn.disabled = false;
      btn.textContent = '가입하기';

      let msg = '가입 중 오류가 발생했습니다.';
      if (error.code === 'auth/email-already-in-use') {
        msg = '이미 가입된 이메일입니다.';
      } else if (error.code === 'auth/invalid-email') {
        msg = '올바른 이메일 형식이 아닙니다.';
      } else if (error.code === 'auth/weak-password') {
        msg = '비밀번호가 너무 약합니다.';
      }
      showError(msg);
    });
}

function login() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;

  document.getElementById('error').style.display = 'none';

  if (!email || !pw) {
    showError('이메일과 비밀번호를 입력해주세요.');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  auth.signInWithEmailAndPassword(email, pw)
    .then((userCredential) => {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('success').innerHTML = `
        <h3>로그인 성공!</h3>
        <p>환영합니다. 프로그램을 다운로드하세요.</p>
        <a href="https://github.com/narusepopo-droid/placemaster/releases/download/v8.46/PlaceMasterPRO.zip" class="btn" style="display:inline-block; margin-top:16px; width:auto; padding:14px 32px;" download>프로그램 다운로드</a>
      `;
      document.getElementById('success').style.display = 'block';
      document.querySelector('.tabs').style.display = 'none';
    })
    .catch((error) => {
      btn.disabled = false;
      btn.textContent = '로그인';

      let msg = '로그인 중 오류가 발생했습니다.';
      if (error.code === 'auth/user-not-found') {
        msg = '등록되지 않은 이메일입니다.';
      } else if (error.code === 'auth/wrong-password') {
        msg = '비밀번호가 올바르지 않습니다.';
      } else if (error.code === 'auth/invalid-email') {
        msg = '올바른 이메일 형식이 아닙니다.';
      }
      showError(msg);
    });
}

// Enter 키로 제출
document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    if (document.getElementById('signup-form').classList.contains('active')) {
      signup();
    } else {
      login();
    }
  }
});
</script>

</body>
</html>
